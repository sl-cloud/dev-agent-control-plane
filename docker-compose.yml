name: dev-agent-control-plane

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    container_name: cp-api
    command: sh -c "npm run migrate && npm run seed && npm run dev:api"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dashboard/node_modules
    ports:
      - '${API_HOST_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: build
    container_name: cp-worker
    # Does not run migrate itself: `drizzle-orm/migrator` and pg-boss's own
    # schema bootstrap are not safe to run concurrently from two processes
    # (both can deadlock or hit a unique-violation racing to create the
    # same tracking table/schema). The api service owns migrate+seed;
    # worker waits for api to be healthy so it always starts against an
    # already-migrated database.
    command: sh -c "npm run dev:worker"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dashboard/node_modules
      - ${HOME}/.local/share/opencode:/home/app/.local/share/opencode:ro
    env_file:
      - .env
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cp_dev_password}
      POSTGRES_DB: control_plane
    ports:
      - '${DB_HOST_PORT:-5432}:5432'
    volumes:
      - cp-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U control_plane -d control_plane']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cp-db-data:
