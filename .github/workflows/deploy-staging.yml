name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (e.g. sha-<40-hex>). Used for rollback.'
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify AI provider config
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL_DEFAULT: ${{ vars.AI_MODEL_DEFAULT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$AI_PROVIDER" ] || [ "$AI_PROVIDER" = "fake" ]; then
            echo "::error::Set AI_PROVIDER to openai or deepseek for staging. fake is local-only."
            exit 1
          fi
          if [ -z "$AI_MODEL_DEFAULT" ] || [ "$AI_MODEL_DEFAULT" = "fake-planner-v1" ]; then
            echo "::error::Set AI_MODEL_DEFAULT to a real provider model for staging."
            exit 1
          fi
          case "$AI_PROVIDER" in
            openai)
              if [ -z "$OPENAI_API_KEY" ]; then
                echo "::error::OPENAI_API_KEY is required when AI_PROVIDER=openai."
                exit 1
              fi
              ;;
            deepseek)
              if [ -z "$DEEPSEEK_API_KEY" ]; then
                echo "::error::DEEPSEEK_API_KEY is required when AI_PROVIDER=deepseek."
                exit 1
              fi
              ;;
            *)
              echo "::error::Unsupported staging AI_PROVIDER: $AI_PROVIDER"
              exit 1
              ;;
          esac

      - name: Verify Playwright target config
        env:
          PLAYWRIGHT_TARGET_URL: ${{ vars.PLAYWRIGHT_TARGET_URL }}
          PLAYWRIGHT_BASIC_AUTH_USERNAME: ${{ secrets.PLAYWRIGHT_BASIC_AUTH_USERNAME }}
          PLAYWRIGHT_BASIC_AUTH_PASSWORD: ${{ secrets.PLAYWRIGHT_BASIC_AUTH_PASSWORD }}
          TEST_ADMIN_EMAIL: ${{ vars.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$PLAYWRIGHT_TARGET_URL" ]; then
            echo "::error::Set PLAYWRIGHT_TARGET_URL to the connected staging app URL."
            exit 1
          fi
          case "$PLAYWRIGHT_TARGET_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::PLAYWRIGHT_TARGET_URL must be an absolute http(s) URL."
              exit 1
              ;;
          esac
          if { [ -n "$PLAYWRIGHT_BASIC_AUTH_USERNAME" ] && [ -z "$PLAYWRIGHT_BASIC_AUTH_PASSWORD" ]; } || \
             { [ -z "$PLAYWRIGHT_BASIC_AUTH_USERNAME" ] && [ -n "$PLAYWRIGHT_BASIC_AUTH_PASSWORD" ]; }; then
            echo "::error::Set both Playwright Basic Auth secrets, or neither."
            exit 1
          fi
          if { [ -n "$TEST_ADMIN_EMAIL" ] && [ -z "$TEST_ADMIN_PASSWORD" ]; } || \
             { [ -z "$TEST_ADMIN_EMAIL" ] && [ -n "$TEST_ADMIN_PASSWORD" ]; }; then
            echo "::error::Set both TEST_ADMIN_EMAIL and TEST_ADMIN_PASSWORD, or neither."
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.STAGING_HOST }}
          port: ${{ vars.STAGING_PORT || 22 }}
          username: ${{ vars.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/dev-agent-control-plane
            git fetch origin main
            git reset --hard ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            update_env() {
              key="$1"
              value="$2"
              sed -i "/^${key}=/d" .env
              if [ -n "$value" ]; then
                printf '%s=%s\n' "$key" "$value" >> .env
              fi
            }
            update_env IMAGE_TAG "${{ steps.image.outputs.tag }}"
            update_env AI_PROVIDER "${{ vars.AI_PROVIDER }}"
            update_env AI_MODEL_DEFAULT "${{ vars.AI_MODEL_DEFAULT }}"
            update_env AI_MODEL_CHANGE_ANALYSIS "${{ vars.AI_MODEL_CHANGE_ANALYSIS }}"
            update_env AI_MODEL_TEST_PLANNING "${{ vars.AI_MODEL_TEST_PLANNING }}"
            update_env DEEPSEEK_API_KEY "${{ secrets.DEEPSEEK_API_KEY }}"
            update_env OPENAI_API_KEY "${{ secrets.OPENAI_API_KEY }}"
            update_env PLAYWRIGHT_TARGET_URL "${{ vars.PLAYWRIGHT_TARGET_URL }}"
            if [ -n "${{ secrets.PLAYWRIGHT_BASIC_AUTH_USERNAME }}" ]; then
              update_env PLAYWRIGHT_BASIC_AUTH_USERNAME "${{ secrets.PLAYWRIGHT_BASIC_AUTH_USERNAME }}"
              update_env PLAYWRIGHT_BASIC_AUTH_PASSWORD "${{ secrets.PLAYWRIGHT_BASIC_AUTH_PASSWORD }}"
            fi
            if [ -n "${{ vars.TEST_ADMIN_EMAIL }}" ]; then
              update_env TEST_ADMIN_EMAIL "${{ vars.TEST_ADMIN_EMAIL }}"
              update_env TEST_ADMIN_PASSWORD "${{ secrets.TEST_ADMIN_PASSWORD }}"
            fi
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker compose -f docker-compose.yml -f docker-compose.staging.yml run --rm migrate
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d --wait api worker db proxy

      - name: Health verify
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "${{ vars.STAGING_BASE_URL }}/health/ready"; then
              echo "healthy"
              exit 0
            fi
            echo "not ready yet, retrying in 6s ($i/10)"
            sleep 6
          done
          echo "::error::staging never became healthy after deploy"
          exit 1
